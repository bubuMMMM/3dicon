<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TT Internal</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system;min-height:100vh}.w{max-width:760px;margin:auto;padding:24px 18px 70px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}.brand{font-weight:900;letter-spacing:-.04em}.tag{border:1px solid #2a2a2a;border-radius:999px;padding:7px 10px;color:#888;font-size:11px}h1{font-size:clamp(50px,10vw,82px);line-height:.92;letter-spacing:-.07em;margin:0 0 18px}.sub{color:#8c8c8c;max-width:590px;margin-bottom:28px}.form{display:flex;gap:8px;border:1px solid #282828;background:#111;padding:8px;border-radius:18px}input{flex:1;min-width:0;background:transparent;border:0;color:#fff;padding:14px 12px;font-size:15px;outline:0}button,a{border:0;border-radius:12px;padding:13px 16px;font-weight:800;text-decoration:none;cursor:pointer}.go{background:white;color:#050505}.status{display:none;margin-top:14px;color:#999}.status.on{display:block}.status.err{color:#ffaaa5}.card{display:none;margin-top:24px;border:1px solid #252525;background:#101010;border-radius:22px;overflow:hidden}.card.on{display:block}.media{aspect-ratio:9/13;max-height:540px;background:#050505}.media video,.media img{width:100%;height:100%;object-fit:cover}.c{padding:18px}.src{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.09em}.title{font-size:21px;font-weight:850;margin:10px 0 5px;letter-spacing:-.03em}.author{color:#888}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions a,.actions button{text-align:center}.copy{background:#191919;color:white;border:1px solid #292929}.api{margin-top:42px;border-top:1px solid #222;padding-top:24px}.code{white-space:pre-wrap;background:#0c0c0c;border:1px solid #222;border-radius:14px;padding:14px;color:#aaa;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:12px;color:#5f5f5f;margin-top:28px}@media(max-width:620px){.nav{margin-bottom:48px}.form{display:block}.form button{width:100%}.actions{grid-template-columns:1fr}}
</style></head><body><main class="w"><div class="nav"><div class="brand">TT.INTERNAL</div><div class="tag">PRIVATE TOOL</div></div><h1>Colle.<br>Résous.<br>Récupère.</h1><div class="sub">Télécharge les vidéos TikTok publiques dont tu possèdes les droits. Sans yt-dlp.</div><form id="f" class="form"><input id="u" placeholder="https://www.tiktok.com/@user/video/…"><button id="b" class="go">Analyser →</button></form><div id="s" class="status"></div><section id="card" class="card"><div id="m" class="media"></div><div class="c"><div id="src" class="src"></div><div id="t" class="title"></div><div id="a" class="author"></div><div class="actions"><a id="open" class="go" target="_blank" rel="noopener">Ouvrir la vidéo</a><button id="copy" class="copy" type="button">Copier l’URL</button></div></div></section><section class="api"><h2>API interne</h2><div id="code" class="code"></div></section><div class="small">Les endpoints TikTok non officiels peuvent changer. Respecte les droits des créateurs et les conditions de la plateforme.</div></main><script>
const $=x=>document.getElementById(x);let last=null;$("code").textContent="POST "+location.origin+"/api/resolve\nContent-Type: application/json\n\n{ \"url\": \"https://www.tiktok.com/@user/video/...\" }";
function st(x,e=false){$("s").textContent=x;$("s").className="status on"+(e?" err":"")}
$("f").onsubmit=async e=>{e.preventDefault();const url=$("u").value.trim();if(!url)return st("Colle une URL TikTok.",true);$("b").disabled=true;$("card").className="card";st("Analyse en cours…");try{const r=await fetch("/api/resolve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Échec de résolution");last=d;$("src").textContent=d.source;$("t").textContent=d.title||"Vidéo TikTok";$("a").textContent=d.author?"@"+d.author:"Auteur inconnu";$("open").href=d.videoUrl;$("m").innerHTML="";const v=document.createElement("video");v.src=d.videoUrl;v.controls=true;v.playsInline=true;if(d.cover)v.poster=d.cover;$("m").appendChild(v);$("card").className="card on";st("OK · vidéo résolue")}catch(err){st(err.message||"Erreur",true)}finally{$("b").disabled=false}};
$("copy").onclick=async()=>{if(!last)return;await navigator.clipboard.writeText(last.videoUrl);$("copy").textContent="Copié ✓";setTimeout(()=>$("copy").textContent="Copier l’URL",1200)}
</script></body></html>
